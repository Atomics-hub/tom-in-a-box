<svg width="980" height="610" viewBox="0 0 980 610" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">tom-in-a-box offline demo terminal output</title>
  <desc id="desc">A terminal screenshot showing the no-spend dry run and offline demo output for tib.</desc>
