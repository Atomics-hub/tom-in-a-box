  <line x1="34" y1="398" x2="946" y2="398" stroke="#374151"/>
  <text x="34" y="438" fill="#93c5fd" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17">$ bun run src/cli.ts bench benchmarks --offline</text>
